<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vazão de microbacia — Santa Catarina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E8EAE4; --papel2:#DCE0D8; --tinta:#1B3A34; --fraca:#5C7169;
  --agua:#1F6E8C; --curva:#A8825C; --alerta:#B0492B;
  --linha:rgba(27,58,52,.16); --campo:#FFFFFF; --barra:#12262B;
  --sans:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#16262B; --papel2:#0F1C20; --tinta:#DCE6E2; --fraca:#8FA7A0;
  --linha:rgba(220,230,226,.14); --campo:#1E3238; }}
:root[data-theme="dark"]{
  --papel:#16262B; --papel2:#0F1C20; --tinta:#DCE6E2; --fraca:#8FA7A0;
  --linha:rgba(220,230,226,.14); --campo:#1E3238; }
/* O atributo hidden do HTML funciona por uma regra da folha do navegador,
   que qualquer display: definido aqui sobrescreve. Sem este !important,
   elemento com display próprio nunca some ao receber hidden. */
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--tinta);background:var(--barra);
  display:grid;grid-template-rows:auto 1fr;overflow:hidden;-webkit-text-size-adjust:100%}

header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
  padding:.5rem 1rem;background:var(--barra);color:#E8EAE4;border-bottom:3px solid var(--curva)}
header h1{font-size:1rem;font-weight:600;margin:0;white-space:nowrap}
header select{background:rgba(232,234,228,.08);color:#E8EAE4;border:1px solid rgba(232,234,228,.28);
  padding:.25rem .4rem;font-size:.78rem;border-radius:2px;font-family:var(--sans);max-width:15rem}
header .camadas{margin-left:auto;display:flex;gap:.15rem}
header .camadas button{background:transparent;color:#8FB0A8;border:1px solid rgba(232,234,228,.25);
  padding:.22rem .55rem;font-size:.74rem;cursor:pointer;border-radius:2px;font-family:var(--sans)}
header .camadas button[aria-pressed="true"]{background:var(--curva);color:#12262B;border-color:var(--curva)}

main{display:grid;grid-template-columns:1fr 25rem;min-height:0}
.mapa{position:relative;min-height:0;overflow:hidden;background:var(--papel2)}
#tela{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.legenda{position:absolute;left:.7rem;bottom:.7rem;background:rgba(232,234,228,.93);
  color:#1B3A34;border-radius:2px;padding:.5rem .6rem;font-size:.7rem;line-height:1.5;max-width:11rem}
.legenda i{display:inline-block;width:.62rem;height:.62rem;margin-right:.35rem;vertical-align:-1px}
.escala{position:absolute;right:.7rem;bottom:.7rem;background:rgba(232,234,228,.93);color:#1B3A34;
  border-radius:2px;padding:.28rem .5rem;font-family:var(--mono);font-size:.68rem}
.estado{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  padding:2rem;color:var(--tinta);font-size:.9rem;line-height:1.6;background:var(--papel2)}
.estado b{display:block;font-size:1.05rem;margin-bottom:.4rem}

aside{background:var(--papel);border-left:1px solid var(--linha);overflow-y:auto;
  display:flex;flex-direction:column;min-height:0}
.painel{padding:1rem 1.05rem}
.vazio p{margin:0 0 .75rem;line-height:1.55;max-width:34ch}
.vazio .dica{font-size:.83rem;color:var(--fraca);border-left:2px solid var(--curva);padding-left:.7rem}

.q{display:flex;align-items:baseline;gap:.45rem;padding-bottom:.5rem}
.q b{font-family:var(--mono);font-weight:500;font-size:2.7rem;line-height:1;
  color:var(--agua);font-variant-numeric:tabular-nums}
.q span{font-size:.92rem;color:var(--fraca)}
.q-sub{font-size:.8rem;color:var(--fraca);padding-bottom:.85rem;margin-bottom:.9rem;
  border-bottom:1px solid var(--linha)}
h2{font-size:.8rem;font-weight:600;margin:0 0 .5rem;color:var(--fraca)}
section+section{margin-top:1.25rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
td{padding:.28rem 0;border-bottom:1px dotted var(--linha)}
td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.81rem}
tr:last-child td{border-bottom:none}
td.destaque:last-child{color:var(--agua);font-weight:500}
.barra-uso{display:flex;height:1.15rem;border-radius:2px;overflow:hidden;margin-bottom:.5rem}
.barra-uso div{height:100%}
.leg-uso{font-size:.78rem;line-height:1.6}
.leg-uso span{display:inline-block;margin-right:.7rem;white-space:nowrap}
.leg-uso i{display:inline-block;width:.6rem;height:.6rem;margin-right:.28rem}
.controles{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .7rem}
.controles label{display:flex;flex-direction:column;gap:.18rem;font-size:.76rem;color:var(--fraca)}
select,input{font-family:var(--mono);font-size:.82rem;padding:.3rem .4rem;
  border:1px solid var(--linha);border-radius:2px;background:var(--campo);color:var(--tinta);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--curva);outline-offset:1px}
.nota{font-size:.76rem;color:var(--fraca);line-height:1.5;margin:.5rem 0 0}
details summary{cursor:pointer;font-size:.8rem;color:var(--agua);margin-bottom:.5rem}
.aviso{font-size:.81rem;line-height:1.5;border-left:3px solid var(--alerta);
  padding:.4rem 0 .4rem .65rem;margin-bottom:.45rem}
.rodape{margin-top:auto;padding:.85rem 1.05rem;border-top:1px solid var(--linha);
  font-size:.74rem;line-height:1.5;color:var(--fraca)}
button.acao{font-family:var(--sans);font-size:.81rem;font-weight:500;color:#E8EAE4;
  background:var(--agua);border:none;border-radius:2px;padding:.42rem .75rem;cursor:pointer}
button.lim{background:transparent;color:var(--agua);padding-left:0}
.acoes{display:flex;gap:.55rem;align-items:center;margin-top:1.1rem}
a{color:var(--agua)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(36vh,1fr) auto}
  aside{border-left:none;border-top:1px solid var(--linha);max-height:56vh}
  header h1{font-size:.92rem}
}
</style>
</head>
<body>

<header>
  <h1>Vazão de microbacia</h1>
  <select id="sel-regiao" aria-label="Região carregada"></select>
  <a href="preparar.html" style="color:#8FB0A8;font-size:.78rem;text-decoration:none;border-bottom:1px solid rgba(143,176,168,.4)">Preparar região</a>
  <div class="camadas">
    <button id="bt-relevo" aria-pressed="true">Relevo</button>
    <button id="bt-uso" aria-pressed="false">Uso do solo</button>
    <button id="bt-ruas" aria-pressed="false" style="margin-left:.5rem">Ruas</button>
    <button id="bt-ajustar" style="margin-left:.5rem">Ajustar</button>
  </div>
  <label style="font-size:.74rem;color:#8FB0A8;display:flex;align-items:center;gap:.35rem">Ancoragem
    <select id="c-ancora" style="background:rgba(232,234,228,.08);color:#E8EAE4;border:1px solid rgba(232,234,228,.28);padding:.2rem .3rem;font-size:.74rem;border-radius:2px;font-family:var(--sans)">
      <option value="0">exata, onde eu clicar</option>
      <option value="2">até 2 células</option>
      <option value="5" selected>até 5 células</option>
    </select></label>
</header>

<main>
  <div class="mapa">
    <canvas id="tela"></canvas>
    <div class="legenda" id="legenda" hidden></div>
    <div class="escala" id="escala"></div>
    <div class="estado" id="estado"><b>Carregando</b>preparando o grafo de fluxo…</div>
  </div>
  <aside>
    <div class="painel" id="painel"></div>
    <div class="rodape" id="rodape">
      Pré-dimensionamento. Não substitui projeto executivo nem dispensa responsável técnico com ART.
    </div>
  </aside>
</main>

function b64(s, Tipo){
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new Tipo(bytes.buffer);
}

async function descomprimir(ab){
  const u8 = new Uint8Array(ab);
  if(!(u8[0]===0x1f && u8[1]===0x8b)) return ab;   // o servidor já descomprimiu
  if(!('DecompressionStream' in window))
    throw new Error("Este navegador não descomprime gzip. Use uma versão mais recente.");
  const fluxo = new Blob([ab]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(fluxo).arrayBuffer();
}

async function listarRegioes(){
  try{

    if(!r.ok) throw 0;
    const m = await r.json();
    if(m.regioes && m.regioes.length) return m.regioes;
  }catch(e){ /* sem dados instalados: cai na demonstração */ }
  return null;
}

/* Busca com relógio e com progresso.

   Requisição parada é o que trava para sempre sem dar erro: fica esperando
   uma resposta que nunca vem. Aqui, se passarem 25 s sem chegar um byte
   novo, a busca é cancelada e vira mensagem legível. */
async function buscar(url, fase, rotulo){
  const ctrl = new AbortController();
  let relogio = setTimeout(() => ctrl.abort(), 25000);
  const adiar = () => { clearTimeout(relogio); relogio = setTimeout(() => ctrl.abort(), 25000); };

  let resp;
  try{
    resp = await fetch(url, {signal:ctrl.signal, cache:'no-cache'});
  }catch(e){
    clearTimeout(relogio);
    throw new Error(e.name === 'AbortError'
      ? `O servidor não respondeu em 25 s ao pedir ${url}. Recarregue a página; se `
      + `insistir, confira se a publicação do GitHub Pages terminou.`
      : `Falha de rede ao pedir ${url}.`);
  }
  if(!resp.ok){ clearTimeout(relogio); return {status:resp.status, dados:null}; }

  const total = +resp.headers.get('content-length') || 0;
  const leitor = resp.body && resp.body.getReader ? resp.body.getReader() : null;
  if(!leitor){ clearTimeout(relogio); return {status:200, dados:await resp.arrayBuffer()}; }

  const partes = []; let lido = 0;
  try{
    for(;;){
      const {done, value} = await leitor.read();
      if(done) break;
      adiar();
      partes.push(value); lido += value.length;
      if(fase) fase('Carregando', `${rotulo}<br>${(lido/1024).toFixed(0)} KB`
        + (total ? ` de ${(total/1024).toFixed(0)} KB` : ''));
    }
  }catch(e){
    throw new Error(`O download de ${url} parou no meio, depois de `
      + `${(lido/1024).toFixed(0)} KB. Recarregue a página.`);
  }finally{ clearTimeout(relogio); }

  const juntas = new Uint8Array(lido); let off = 0;
  for(const p of partes){ juntas.set(p, off); off += p.length; }
  return {status:200, dados:juntas.buffer};
}

/* Baixa o raster da região, tolerando duas coisas que acontecem na prática:
   o navegador ter descompactado o .gz sozinho na hora do download (Safari faz
   isso), e o servidor devolver uma página HTML de erro no lugar do arquivo. */
async function baixarRaster(nome, fase, rotulo){
  const tentativas = [nome];
  if(nome.endsWith('.gz')) tentativas.push(nome.slice(0, -3));
  const falhas = [];

  for(const alvo of tentativas){
    const r = await buscar('dados/' + alvo, fase, rotulo);
    if(!r.dados){ falhas.push(`${alvo}: ${r.status}`); continue; }
    const inicio = new TextDecoder()
      .decode(new Uint8Array(r.dados, 0, Math.min(200, r.dados.byteLength))).toLowerCase();
    if(inicio.includes('<!doctype') || inicio.includes('<html')){
      falhas.push(`${alvo}: veio uma página HTML no lugar do arquivo`);
      continue;
    }
    if(fase) fase('Carregando', `${rotulo}<br>descomprimindo…`);
    await new Promise(r2 => setTimeout(r2));
    return await descomprimir(r.dados);
  }

  throw new Error(
    `Não achei o raster da região. Tentei ${falhas.join('; ')}. `
  + `Confira se o arquivo "${nome}" está em docs/dados/ no repositório, com esse nome exato.`);
}

async function carregarRegiao(ref, fase){
  if(ref === null){                       // região embutida no próprio arquivo
    if(fase) fase('Carregando', 'descomprimindo os dados embutidos…');
    await new Promise(r => setTimeout(r));
    const D = JSON.parse($('demo').textContent);
    const buf = await descomprimir(b64(D.bin, Uint8Array).buffer);
    const n = D.meta.lin*D.meta.col;
    if(buf.byteLength < n*4) throw new Error(
      'Os dados embutidos neste arquivo estão incompletos.');
    return { meta: D.meta,
      mde: new Int16Array(buf, 0, n),
      d8:  new Uint8Array(buf, n*2, n),
      uso: new Uint8Array(buf, n*3, n) };
  }
  const r = await buscar('dados/'+ref.meta, fase, ref.nome);
  if(!r.dados) throw new Error(
    `Não achei dados/${ref.meta} (erro ${r.status}). Confira se o arquivo subiu.`);
  const meta = JSON.parse(new TextDecoder().decode(r.dados));
  const buf  = await baixarRaster(meta.bin, fase, meta.nome);
  const n = meta.lin*meta.col;
  if(buf.byteLength < n*4) throw new Error(
    `O arquivo ${meta.bin} tem ${buf.byteLength.toLocaleString('pt-BR')} bytes, mas a região `
  + `declara ${meta.lin} × ${meta.col} células, que precisam de `
  + `${(n*4).toLocaleString('pt-BR')}. O arquivo provavelmente subiu incompleto ou corrompido: `
  + `apague e suba de novo, arrastando direto da pasta de downloads.`);
  return { meta,
    mde: new Int16Array(buf, 0, n),
    d8:  new Uint8Array(buf, n*2, n),
    uso: new Uint8Array(buf, n*3, n) };
}

/* ===========================================================================
   GRAFO DE FLUXO (montado no navegador, uma vez por região)
   =========================================================================== */
const respirar = () => new Promise(r => setTimeout(r));

/* Montagem do grafo em etapas, cedendo o controle ao navegador entre elas.
   Numa região grande isso é a diferença entre ver o progresso andando e ver
   a aba congelada sem explicação. */
async function montarGrafo(d, aviso){
  const {lin, col} = d.meta, n = lin*col;
  Object.assign(G, {lin, col, n, cel:d.meta.celula, meta:d.meta,
                    mde:d.mde, d8:d.d8, uso:d.uso});

  const passo = 400000;                       // células entre respiros
  const etapa = async (texto, fn) => { aviso(texto); await respirar(); return fn(); };

  /* O receptor de cada célula sai do código D8 por uma conta de duas linhas,
     então guardá-lo custaria 4 bytes por célula sem necessidade. O mesmo vale
     para a declividade, que só é usada nas células de uma bacia por vez.
     Numa região de 28 milhões de células isso são 228 MB economizados. */
  const recept = k => {
    const dir = d.d8[k];
    if(!dir) return -1;
    const [di,dj] = DESL[dir-1];
    const i=(k/col)|0, j=k%col, vi=i+di, vj=j+dj;
    return (vi<0||vj<0||vi>=lin||vj>=col) ? -1 : vi*col+vj;
  };
  G.recept = recept;

  const acc = await etapa('acumulação', () => {
    const a = new Float32Array(n).fill(1);
    const grau = new Int32Array(n);
    for(let k=0;k<n;k++){ const r=recept(k); if(r>=0) grau[r]++; }
    const pilha = new Int32Array(n); let t=0;
    for(let k=0;k<n;k++) if(grau[k]===0) pilha[t++]=k;
    while(t>0){
      const k=pilha[--t], r=recept(k);
      if(r<0) continue;
      a[r]+=a[k];
      if(--grau[r]===0) pilha[t++]=r;
    }
    return a;
  });

  const [inicio, doadores] = await etapa('grafo invertido', () => {
    const ini = new Int32Array(n+1), doa = new Int32Array(n);
    for(let k=0;k<n;k++){ const r=recept(k); if(r>=0) ini[r+1]++; }
    for(let k=0;k<n;k++) ini[k+1]+=ini[k];
    const cursor = ini.slice(0,n);
    for(let k=0;k<n;k++){ const r=recept(k); if(r>=0) doa[cursor[r]++]=k; }
    return [ini, doa];
  });

  let accMax=0; for(let k=0;k<n;k++) if(acc[k]>accMax) accMax=acc[k];
  Object.assign(G, {acc, inicio, doadores,
    limiar: Math.max(60, Math.min(accMax*0.01, 4000)),
  });

  const p = d.meta.proj4;
  G.paraCelula = (lon,lat) => {
    const [x,y] = proj4('EPSG:4326', p, [lon,lat]);
    return [Math.floor((d.meta.origem[1]-y)/G.cel), Math.floor((x-d.meta.origem[0])/G.cel)];
  };
  G.paraLonLat = (i,j) => proj4(p, 'EPSG:4326',
    [d.meta.origem[0]+(j+0.5)*G.cel, d.meta.origem[1]-(i+0.5)*G.cel]);

  if(d.meta.idf) Object.assign(estado.idf, d.meta.idf);
}

/* ===========================================================================
   DELIMITAÇÃO
   =========================================================================== */
function ancorar(i,j,raio=5){
  let melhor=-1, mi=i, mj=j;
  for(let a=Math.max(0,i-raio);a<=Math.min(G.lin-1,i+raio);a++)
    for(let b=Math.max(0,j-raio);b<=Math.min(G.col-1,j+raio);b++)
      if(G.acc[a*G.col+b]>melhor){ melhor=G.acc[a*G.col+b]; mi=a; mj=b; }
  return [mi,mj];
}

function delimitar(ex){
  const {inicio,doadores,col,cel} = G;
  /* A distância até o exutório viaja junto com a célula na pilha, em vez de
     num vetor do tamanho da região. O consumo passa a ser proporcional à
     bacia clicada, que é o que de fato importa. */
  const celulas=[], dists=[];
  const pilhaK=[ex], pilhaD=[0];
  while(pilhaK.length){
    const k=pilhaK.pop(), dk=pilhaD.pop();
    celulas.push(k); dists.push(dk);
    const i=(k/col)|0, j=k%col;
    for(let q=inicio[k]; q<inicio[k+1]; q++){
      const d=doadores[q];
      pilhaK.push(d);
      pilhaD.push(dk + cel*Math.hypot(((d/col)|0)-i, (d%col)-j));
    }
  }
  return {celulas, dists};
}

/* Declividade da célula, calculada na hora. Guardar um vetor inteiro só para
   isso custaria 4 bytes por célula da região toda. */
function decliveEm(k){
  const {mde,col,lin,cel} = G;
  const i=(k/col)|0, j=k%col;
  const i0=Math.max(0,i-1), i1=Math.min(lin-1,i+1);
  const j0=Math.max(0,j-1), j1=Math.min(col-1,j+1);
  const gy=(mde[i1*col+j]-mde[i0*col+j])/((i1-i0)*cel);
  const gx=(mde[i*col+j1]-mde[i*col+j0])/((j1-j0)*cel);
  return Math.hypot(gx,gy);
}

function estatisticas(bacia, ex, grupo){
  const {mde,uso,cel} = G;
  const {celulas, dists} = bacia;
  const area_km2 = celulas.length*cel*cel/1e6;
  let L=0, cabeceira=ex, somaDecl=0;
  const hist={};
  for(let q=0;q<celulas.length;q++){
    const k=celulas[q];
    if(dists[q]>L){ L=dists[q]; cabeceira=k; }
    somaDecl+=decliveEm(k);
    hist[uso[k]]=(hist[uso[k]]||0)+1;
  }
  const dH = Math.max(mde[cabeceira]-mde[ex], 0.5);
  let cn=0, c=0;
  for(const u in hist){
    const f=hist[u]/celulas.length;
    cn += CLASSES[u].cn[grupo]*f;
    c  += CLASSES[u].c*f;
  }
  return { area_km2, L_km:L/1000, dH, S:dH/Math.max(L,cel), cn, c,
    comp: Object.entries(hist).map(([u,q])=>({u:+u, pct:q/celulas.length*100}))
                              .sort((a,b)=>b.pct-a.pct),
    declMedia: somaDecl/celulas.length*100,
    cotaEx: mde[ex], nCel: celulas.length };
}

/* ===========================================================================
   HIDROLOGIA
   =========================================================================== */
function tempoConcentracao(e, f){
  const Lk=Math.max(e.L_km,1e-3), Lm=Lk*1000, S=Math.max(e.S,1e-5);
  if(f==="dooge") return 21.88*Math.pow(e.area_km2,0.41)*Math.pow(S,-0.17);
  if(f==="corps") return 191.5*Math.pow(Lk,0.76)*Math.pow(e.dH/Lm,-0.19)/60;
  if(f==="scs")   return 0.0136*Math.pow(Lm,0.8)*Math.pow(1000/e.cn-9,0.7)*Math.pow(e.declMedia,-0.5);
  return 57*Math.pow(Lk*Lk*Lk/e.dH,0.385);        // Kirpich
}
const intensidade = (t,TR,idf) => idf.K*Math.pow(TR,idf.a)/Math.pow(t+idf.b, idf.c);

function racional(e,i,TR){
  const Cf = TR>=100?1.25 : TR>=50?1.20 : TR>=25?1.10 : 1.00;
  const C = Math.min(e.c*Cf, 1);
  return { Q: C*i*e.area_km2/3.6, C };
}

/* lambda = Ia/S. O 0,20 clássico vem de bacias dos EUA; vários estudos
   brasileiros apontam 0,05 como mais aderente. Em bacia rural com CN baixo a
   escolha muda a vazão em uma ordem de grandeza, então fica exposta. */
function scs(e,i,Tc,lambda){
  const P=i*Tc/60, S=25400/e.cn-254, Ia=lambda*S;
  const Pe = P>Ia ? Math.pow(P-Ia,2)/(P-Ia+S) : 0;
  const Tp = (0.133*Tc/2 + 0.6*Tc)/60;
  return { Q:0.208*e.area_km2*Pe/Tp, P, Pe, S, Ia, cr: P>0?Pe/P:0 };
}

const capTubo  = (D,S,n)   => (0.3117/n)*Math.pow(D,8/3)*Math.sqrt(S);
const capCaixa = (b,h,S,n) => (1/n)*(b*h)*Math.pow(b*h/(2*(b+h)),2/3)*Math.sqrt(S);

function dimensionar(Q, decl, n=0.015){
  const S=Math.max(decl,0.002);
  const Dreq=Math.pow(Q*n/(0.3117*Math.sqrt(S)),3/8);
  for(const D of DIAM) if(capTubo(D,S,n)>=Q){
    const A=Math.PI*D*D/4; return {tipo:`BSTC Ø${D.toFixed(2)} m`,Dreq,A,V:Q/A}; }
  for(const D of DIAM) if(2*capTubo(D,S,n)>=Q){
    const A=2*Math.PI*D*D/4; return {tipo:`BDTC 2 × Ø${D.toFixed(2)} m`,Dreq,A,V:Q/A}; }
  for(const b of CAIXA) if(capCaixa(b,b,S,n)>=Q)
    return {tipo:`BSCC ${b.toFixed(2)} × ${b.toFixed(2)} m`,Dreq,A:b*b,V:Q/(b*b)};
  for(const b of CAIXA) for(const c of [2,3]) if(c*capCaixa(b,b,S,n)>=Q){
    const A=c*b*b; return {tipo:`BxCC ${c} × ${b.toFixed(2)} × ${b.toFixed(2)} m`,Dreq,A,V:Q/A}; }
  return {tipo:"Acima da faixa de bueiro — avaliar ponte",Dreq,V:NaN,A:NaN};
}

/* ===========================================================================
   MAPA BASE DE RUAS

   O portal desenha em UTM e os tiles vêm em Web Mercator. Sobre 20 km a
   relação entre os dois é praticamente afim, então basta ajustar uma
   transformação a partir de três cantos da grade e desenhar os tiles nela.
   Nada de pixel é lido dos tiles, só desenhado, então não há questão de
   permissão entre sites.
   =========================================================================== */
const R_TERRA = 6378137, MUNDO = Math.PI*R_TERRA;   // meia circunferência
const tiles = new Map();
let ruas = false, tilesFalhos = 0, tilesPedidos = 0;

/* Mercator com origem no canto noroeste do mundo: x cresce para leste,
   y cresce para o sul. Assim o tile (tx,ty) ocupa um quadrado simples. */
function paraMercator(lon, lat){
  const la = Math.max(-85, Math.min(85, lat))*Math.PI/180;
  return [ MUNDO + R_TERRA*lon*Math.PI/180,
           MUNDO - R_TERRA*Math.log(Math.tan(Math.PI/4 + la/2)) ];
}

/* Resolve a·X + c·Y + e = X' para três pontos de controle (regra de Cramer). */
function afim3(p){
  const d = (A,B,C) => A[0]*(B[1]*C[2]-C[1]*B[2]) - A[1]*(B[0]*C[2]-C[0]*B[2])
                     + A[2]*(B[0]*C[1]-C[0]*B[1]);
  const M = [[p[0][0],p[1][0],p[2][0]], [p[0][1],p[1][1],p[2][1]], [1,1,1]];
  const det = d(M[0],M[1],M[2]);
  if(Math.abs(det) < 1e-9) return null;
  return alvo => {
    const V=[alvo[0],alvo[1],alvo[2]];
    const s=(k)=>{ const N=M.map(r=>r.slice()); N[k]=V; return d(N[0],N[1],N[2])/det; };
    return [s(0), s(1), s(2)];
  };
}

/* Transformação de (x,y) do Mercator para pixels da tela. */
function transformadaRuas(){
  const pontos = [[0,0], [0,G.col-1], [G.lin-1,0]];
  const merc = [], telaX = [], telaY = [];
  for(const [i,j] of pontos){
    const [lon,lat] = G.paraLonLat(i,j);
    merc.push(paraMercator(lon,lat));
    telaX.push(vista.ox + (j+0.5)*vista.esc);
    telaY.push(vista.oy + (i+0.5)*vista.esc);
  }
  const resolve = afim3(merc);
  if(!resolve) return null;
  const [a,c,e] = resolve(telaX);
  const [b,d,f] = resolve(telaY);
  return {a,b,c,d,e,f, merc};
}

function zoomAdequado(){
  const [,lat] = G.paraLonLat(G.lin/2, G.col/2);
  // O zoom tem que acompanhar o que a TELA mostra, não o tamanho da célula:
  // a grade quase sempre aparece ampliada, e escolher pela célula deixaria a
  // rua borrada e sem nome legível.
  const metrosPorPixel = Math.max(0.8, G.cel/Math.max(vista.esc, 0.05));
  const z = Math.log2(2*MUNDO*Math.cos(lat*Math.PI/180)/(256*metrosPorPixel));
  return Math.max(8, Math.min(18, Math.round(z)));
}

function pegarTile(z, x, y){
  const chave = `${z}/${x}/${y}`;
  if(tiles.has(chave)) return tiles.get(chave);
  const img = new Image();
  tiles.set(chave, img);
  tilesPedidos++;
  img.onload = () => { if(ruas) desenhar(); };
  img.onerror = () => {
    tiles.set(chave, null);
    if(++tilesFalhos >= tilesPedidos && tilesFalhos > 2){
      ruas = false;
      $('bt-ruas').setAttribute('aria-pressed', false);
      pintarBase(); desenhar(); legenda(true);
    }
  };
  img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  return img;
}

function desenharRuas(){
  const T = transformadaRuas();
  if(!T) return;
  const z = zoomAdequado(), S = 2*MUNDO/Math.pow(2,z), n = Math.pow(2,z);

  // Só a parte visível: com zoom, pedir a região inteira estouraria o limite
  // de tiles e o mapa ficaria sem rua nenhuma justamente quando mais precisa.
  const vj0 = Math.max(0, Math.floor((0 - vista.ox)/vista.esc));
  const vj1 = Math.min(G.col-1, Math.ceil((tela.width - vista.ox)/vista.esc));
  const vi0 = Math.max(0, Math.floor((0 - vista.oy)/vista.esc));
  const vi1 = Math.min(G.lin-1, Math.ceil((tela.height - vista.oy)/vista.esc));
  if(vj1 < vj0 || vi1 < vi0) return;

  let xmin=Infinity, xmax=-Infinity, ymin=Infinity, ymax=-Infinity;
  for(let i of [vi0, vi1]) for(let j of [vj0, vj1]){
    const [lon,lat] = G.paraLonLat(i,j);
    const [mx,my] = paraMercator(lon,lat);
    xmin=Math.min(xmin,mx); xmax=Math.max(xmax,mx);
    ymin=Math.min(ymin,my); ymax=Math.max(ymax,my);
  }
  const tx0=Math.max(0,Math.floor(xmin/S)), tx1=Math.min(n-1,Math.floor(xmax/S));
  const ty0=Math.max(0,Math.floor(ymin/S)), ty1=Math.min(n-1,Math.floor(ymax/S));
  if((tx1-tx0+1)*(ty1-ty0+1) > 120) return;            // recorte grande demais

  ctx.save();
  ctx.beginPath();
  ctx.rect(vista.ox, vista.oy, G.col*vista.esc, G.lin*vista.esc);
  ctx.clip();
  ctx.setTransform(T.a, T.b, T.c, T.d, T.e, T.f);
  ctx.imageSmoothingEnabled = true;
  for(let tx=tx0; tx<=tx1; tx++) for(let ty=ty0; ty<=ty1; ty++){
    const img = pegarTile(z, tx, ty);
    if(img && img.complete && img.naturalWidth)
      ctx.drawImage(img, tx*S, ty*S, S, S);
  }
  ctx.restore();
}

/* ===========================================================================
   MAPA
   =========================================================================== */
const tela=$('tela'), ctx=tela.getContext('2d');
const base=document.createElement('canvas');
let bctx=null;

const LADO_MAX_BASE = 2800;   // pixels da imagem de fundo

function pintarBase(){
  const {lin,col,n,mde,uso,acc,cel,limiar}=G;
  /* A imagem de fundo não precisa de um pixel por célula: a tela tem uns dois
     milhões de pixels, e uma região de 28 milhões de células gastaria 114 MB
     numa imagem que ninguém consegue ver inteira. */
  const passoB = Math.max(1, Math.ceil(Math.max(lin,col)/LADO_MAX_BASE));
  const bl = Math.max(1, Math.floor(lin/passoB)), bc = Math.max(1, Math.floor(col/passoB));
  G.passoBase = passoB;
  base.width=bc; base.height=bl; bctx=base.getContext('2d');
  const img=bctx.createImageData(bc,bl), d=img.data;
  let zmin=Infinity, zmax=-Infinity;
  const salto=Math.max(1,(n/2e6)|0);
  for(let k=0;k<n;k+=salto){ if(mde[k]<zmin)zmin=mde[k]; if(mde[k]>zmax)zmax=mde[k]; }
  const amp=Math.max(1,zmax-zmin);

  const dentroBacia = bacia ? new Uint8Array(n) : null;
  if(dentroBacia) for(const k of bacia.celulas) dentroBacia[k]=1;

  for(let bi=0;bi<bl;bi++) for(let bj=0;bj<bc;bj++){
    const i=bi*passoB, j=bj*passoB;
    const k=i*col+j, o=(bi*bc+bj)*4;
    const i0=Math.max(0,i-passoB), i1=Math.min(lin-1,i+passoB);
    const j0=Math.max(0,j-passoB), j1=Math.min(col-1,j+passoB);
    const gy=(mde[i1*col+j]-mde[i0*col+j])/((i1-i0)*cel);
    const gx=(mde[i*col+j1]-mde[i*col+j0])/((j1-j0)*cel);
    let s=(0.7071*(-gx*0.7071+gy*0.7071)+0.7071)/Math.sqrt(gx*gx+gy*gy+1);
    s=Math.max(0.15,Math.min(1,s*1.15));

    let r,g,b;
    if(camada==='uso'){
      const cor=CLASSES[uso[k]].cor, m=0.45+0.55*s;
      r=parseInt(cor.slice(1,3),16)*m; g=parseInt(cor.slice(3,5),16)*m; b=parseInt(cor.slice(5,7),16)*m;
    }else{
      const z=(mde[k]-zmin)/amp;
      r=(206-70*z)*s*0.85+40; g=(214-58*z)*s*0.85+46; b=(196-84*z)*s*0.85+40;
    }
    // Com passo maior que 1 a drenagem sumiria entre as amostras, então o
    // canal é procurado na vizinhança que o pixel representa.
    let accMaxLocal=acc[k];
    if(passoB>1) for(let a=0;a<passoB;a++) for(let b2=0;b2<passoB;b2++){
      const kk=(i+a)*col+(j+b2);
      if(i+a<lin && j+b2<col && acc[kk]>accMaxLocal) accMaxLocal=acc[kk];
    }
    if(accMaxLocal>=limiar){
      const w=Math.min(1,Math.log(accMaxLocal/limiar+1)/3.2);
      r=r*(1-w)+31*w; g=g*(1-w)+110*w; b=b*(1-w)+140*w;
    }
    d[o]=r; d[o+1]=g; d[o+2]=b;
    // Com as ruas ligadas, o terreno fica translúcido mas a drenagem
    // continua opaca: é ela que o usuário precisa mirar para clicar.
    d[o+3] = ruas ? (accMaxLocal>=limiar ? 255 : (camada==='uso' ? 150 : 105)) : 255;
    if(dentroBacia && dentroBacia[k]){
      d[o]=d[o]*0.62+78*0.38; d[o+1]=d[o+1]*0.62+156*0.38; d[o+2]=d[o+2]*0.62+184*0.38;
      if(ruas) d[o+3]=Math.max(d[o+3],165);
    }
  }
  bctx.putImageData(img,0,0);
}

let escBase=1, mexeu=false;

function ajustar(){
  escBase=Math.min(tela.width/G.col, tela.height/G.lin);
  vista={esc:escBase, ox:(tela.width-G.col*escBase)/2, oy:(tela.height-G.lin*escBase)/2};
  mexeu=false;
}

function redimensionar(){
  const cx=tela.parentElement.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const antes={l:tela.width, a:tela.height};
  tela.width=cx.width*dpr; tela.height=cx.height*dpr;
  tela.style.width=cx.width+'px'; tela.style.height=cx.height+'px';
  if(!G.lin) return;
  if(!mexeu) ajustar();
  else{
    // mantém no centro o que estava no centro antes de redimensionar
    vista.ox += (tela.width-antes.l)/2;
    vista.oy += (tela.height-antes.a)/2;
    escBase=Math.min(tela.width/G.col, tela.height/G.lin);
  }
  desenhar();
}

const LIM_ZOOM=[0.8, 60];

function aplicarZoom(px, py, fator){
  const novo=Math.max(escBase*LIM_ZOOM[0], Math.min(escBase*LIM_ZOOM[1], vista.esc*fator));
  if(novo===vista.esc) return;
  const k=novo/vista.esc;
  vista.ox = px-(px-vista.ox)*k;
  vista.oy = py-(py-vista.oy)*k;
  vista.esc = novo;
  mexeu=true;
  desenhar();
  atualizarEscala();
}

function atualizarEscala(){
  const el=$('escala');
  const larg=tela.getBoundingClientRect().width;
  if(!el||!G.cel||!larg||!vista.esc) return;
  const mpp=G.cel/vista.esc*(tela.width/larg);
  el.textContent = `${(vista.esc/escBase).toFixed(1)}× · ${mpp.toFixed(1)} m/pixel`;
}

function desenhar(){
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--papel2')||'#DCE0D8';
  ctx.fillRect(0,0,tela.width,tela.height);
  if(!bctx) return;
  if(ruas) desenharRuas();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(base, 0, 0, base.width, base.height,
                vista.ox, vista.oy, G.col*vista.esc, G.lin*vista.esc);
  if(!bacia) return;

  const dentro=new Uint8Array(G.n);
  for(const k of bacia.celulas) dentro[k]=1;
  ctx.beginPath();
  ctx.lineWidth=Math.max(1.4, vista.esc*0.22);
  ctx.strokeStyle='#12262B';
  for(const k of bacia.celulas){
    const i=(k/G.col)|0, j=k%G.col, s=vista.esc;
    const x=vista.ox+j*s, y=vista.oy+i*s;
    if(i===0       ||!dentro[k-G.col]){ ctx.moveTo(x,y);   ctx.lineTo(x+s,y); }
    if(i===G.lin-1 ||!dentro[k+G.col]){ ctx.moveTo(x,y+s); ctx.lineTo(x+s,y+s); }
    if(j===0       ||!dentro[k-1]){     ctx.moveTo(x,y);   ctx.lineTo(x,y+s); }
    if(j===G.col-1 ||!dentro[k+1]){     ctx.moveTo(x+s,y); ctx.lineTo(x+s,y+s); }
  }
  ctx.stroke();

  if(bacia.caminho && bacia.caminho.length>1){
    ctx.beginPath();
    ctx.lineWidth=Math.max(2, vista.esc*0.35);
    ctx.strokeStyle='#B0492B'; ctx.lineJoin='round';
    bacia.caminho.forEach((k,n)=>{
      const ci=(k/G.col)|0, cj=k%G.col;
      const x=vista.ox+(cj+0.5)*vista.esc, y=vista.oy+(ci+0.5)*vista.esc;
      n ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
  }

  const i=(exutorio/G.col)|0, j=exutorio%G.col;
  ctx.beginPath();
  ctx.arc(vista.ox+(j+0.5)*vista.esc, vista.oy+(i+0.5)*vista.esc, Math.max(4,vista.esc*0.7),0,6.284);
  ctx.fillStyle='#B0492B'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#E8EAE4'; ctx.stroke();
}

function calcular(){
  if(!bacia) return;
  const e  = estatisticas(bacia, exutorio, estado.grupo);
  const Tc = Math.max(tempoConcentracao(e, estado.formula), 5);
  const i  = intensidade(Tc, estado.TR, estado.idf);
  const R  = racional(e, i, estado.TR);
  const H  = scs(e, i, Tc, estado.lambda);
  const usaRacional = e.area_km2 <= 2;
  const Q  = usaRacional ? R.Q : H.Q;
  const metodo = usaRacional ? "Racional" : "SCS · hidrograma unitário";
  const obra = dimensionar(Q, estado.declBueiro/100);
  const [lon,lat] = G.paraLonLat((exutorio/G.col)|0, exutorio%G.col);

  const disp = ["kirpich","dooge","corps","scs"].map(f=>Math.max(tempoConcentracao(e,f),5));

  const urbano = (e.comp.find(x=>x.u===7)||{pct:0}).pct;
  const accEx  = G.acc[exutorio];

  const av=[];
  /* Diagnóstico do terreno antes de qualquer crítica ao número: se o MDE não
     representa a drenagem no ponto, nenhum resultado abaixo vale. */

    `${urbano.toFixed(0)}% da bacia é área urbanizada e a célula do MDE tem ${G.cel} m. `
  + `Nessa escala o modelo não enxerga meio-fio, telhado nem galeria, que são o que `
  + `conduz a água na cidade. Confira o caminho de jusante no mapa: se ele não desce `
  + `pelo curso d'água real, refaça a região com MDT fino.`);
  if(accEx < 30) av.push(
    `Só ${accEx.toFixed(0)} células drenam para este ponto. Ou ele está perto de um `
  + `divisor de águas, ou o clique caiu fora do talvegue.`);
  if(e.nCel<100) av.push(`Bacia com ${e.nCel} células. Abaixo de ~100 o contorno é dominado pelo tamanho do pixel.`);
  if(bacia.desloc>5*G.cel) av.push(`O exutório foi movido ${bacia.desloc.toFixed(0)} m até a drenagem. Troque a ancoragem para "exata" se quiser o ponto onde clicou.`);
  if(!usaRacional) av.push(`Área de ${e.area_km2.toFixed(1)} km² acima da faixa do método racional (2 km²; o DNIT admite 4). Adotado SCS.`);
  if(Tc<10) av.push(`Tc de ${Tc.toFixed(0)} min abaixo da faixa de validade da maioria das curvas IDF. Piso de 5 min aplicado.`);
  if(H.cr<0.10 && H.P>0) av.push(`A abstração inicial consome ${H.Ia.toFixed(0)} dos ${H.P.toFixed(0)} mm da chuva e só ${(H.cr*100).toFixed(0)}% escoa. Com CN baixo e chuva curta, λ = 0,20 praticamente zera o escoamento. Teste λ = 0,05.`);
  if(e.S<0.005) av.push("Talvegue muito plano. Em relevo plano o traçado D8 sobre MDE de satélite é pouco confiável.");

      </table>

      desce a partir do ponto. Se ela não segue o curso d'água real, o resultado abaixo

    <section><h2>Obra de arte sugerida</h2>

/* ---------------------------------------------------------------------------
   Roda para aproximar, arrastar para deslocar, dois dedos para pinçar.

   O clique que delimita a bacia e o arrasto que move o mapa saem do mesmo
   gesto, então a distinção é pelo deslocamento: menos de 5 pixels conta como
   clique. Sem isso, todo arrasto delimitaria uma bacia indesejada no fim.
   --------------------------------------------------------------------------- */
const LIMIAR_CLIQUE = 5;
const ponteiros = new Map();
let arrasto = null, pinca = null;

const emTela = ev => {
  const r = tela.getBoundingClientRect(), dpr = tela.width/r.width;
  return [ (ev.clientX-r.left)*dpr, (ev.clientY-r.top)*dpr ];
};

tela.addEventListener('wheel', ev => {
  if(!G.lin) return;
  ev.preventDefault();
  const [px,py] = emTela(ev);
  const passo = ev.deltaMode === 1 ? 18 : 1;           // linhas ou pixels
  aplicarZoom(px, py, Math.exp(-ev.deltaY*passo*0.0016));
}, {passive:false});

tela.addEventListener('pointerdown', ev => {
  if(!G.lin) return;
  tela.setPointerCapture(ev.pointerId);
  ponteiros.set(ev.pointerId, emTela(ev));
  if(ponteiros.size === 1){
    const [px,py] = ponteiros.get(ev.pointerId);
    arrasto = {px, py, ox:vista.ox, oy:vista.oy, andou:0};
    tela.style.cursor = 'grabbing';
  }else if(ponteiros.size === 2){
    const [a,b] = [...ponteiros.values()];
    pinca = { dist:Math.hypot(a[0]-b[0], a[1]-b[1]) };
    arrasto = null;
  }
});

tela.addEventListener('pointermove', ev => {
  if(!ponteiros.has(ev.pointerId)) return;
  ponteiros.set(ev.pointerId, emTela(ev));

  if(pinca && ponteiros.size === 2){
    const [a,b] = [...ponteiros.values()];
    const dist = Math.hypot(a[0]-b[0], a[1]-b[1]);
    if(pinca.dist > 0 && dist > 0){
      aplicarZoom((a[0]+b[0])/2, (a[1]+b[1])/2, dist/pinca.dist);
      pinca.dist = dist;
    }
    return;
  }
  if(!arrasto) return;
  const [px,py] = ponteiros.get(ev.pointerId);
  arrasto.andou = Math.max(arrasto.andou, Math.hypot(px-arrasto.px, py-arrasto.py));
  vista.ox = arrasto.ox + (px-arrasto.px);
  vista.oy = arrasto.oy + (py-arrasto.py);
  mexeu = true;
  desenhar();
});

function encerrar(ev){
  const era = ponteiros.get(ev.pointerId);
  ponteiros.delete(ev.pointerId);
  if(ponteiros.size < 2) pinca = null;
  tela.style.cursor = 'crosshair';

  if(arrasto && era && arrasto.andou < LIMIAR_CLIQUE) delimitarEm(era[0], era[1]);
  if(ponteiros.size === 0) arrasto = null;
}
tela.addEventListener('pointerup', encerrar);
tela.addEventListener('pointercancel', ev => {
  ponteiros.delete(ev.pointerId);
  arrasto = null; pinca = null;
  tela.style.cursor = 'crosshair';
});

/* Segue o fluxo a partir do exutório até sair do recorte. É a verificação
   mais direta que existe: se a linha não desce pelo curso d'água que você
   conhece, o MDE não representa a drenagem ali e nenhum número vale. */
function caminhoJusante(k, limite=4000){
  const c=[k]; let atual=k;
  for(let n=0;n<limite;n++){
    const r=G.recept(atual);
    if(r<0) break;
    c.push(r); atual=r;
  }
  return c;
}

function delimitarEm(px, py){
  const j = Math.floor((px-vista.ox)/vista.esc);
  const i = Math.floor((py-vista.oy)/vista.esc);
  if(i<0||j<0||i>=G.lin||j>=G.col) return;
  // Em obra de arte o técnico sabe onde a estrutura fica, e o canal que o MDE
  // enxerga pode estar deslocado. Por isso a ancoragem é escolha dele: em
  // "exata" o exutório é a célula clicada, sem correção nenhuma.
  const raio = +$('c-ancora').value;
  const [ai,aj] = raio > 0 ? ancorar(i, j, raio) : [i, j];
  exutorio = ai*G.col+aj;
  bacia = Object.assign(delimitar(exutorio),
    { desloc:G.cel*Math.hypot(ai-i, aj-j), caminho:caminhoJusante(exutorio) });
  pintarBase(); desenhar(); calcular();
}

async function abrir(ref){
  const painel = $('estado');
  painel.hidden = false;
  const fase = (t, extra='') => {
    painel.innerHTML = `<div><b>${t}</b>${extra}</div>`;
  };
  fase('Carregando', 'buscando os dados da região…');
  bacia=null; exutorio=null;

  try{
    const d = await carregarRegiao(ref, fase);
    const n = d.meta.lin*d.meta.col;
    const tam = `${d.meta.lin} × ${d.meta.col} = ${n.toLocaleString('pt-BR')} células`;
    if(n > 15e6) fase('Região grande',
      `${tam}.<br>Vai usar cerca de ${Math.round(n*18/1e6)} MB de memória e levar `
    + `alguns segundos.<br>Se travar, gere a região de novo com célula maior.`);

    await montarGrafo(d, etapa => fase('Preparando', `${tam}<br>${etapa}…`));

    fase('Preparando', `${tam}<br>desenhando o mapa…`);
    await new Promise(r => setTimeout(r));
    pintarBase(); redimensionar(); legenda(); painelVazio(); atualizarEscala();
    painel.hidden = true;

    const ehDemo = G.meta.id === 'demo';
    $('rodape').innerHTML = (ehDemo
      ? 'Dados de <b>demonstração</b>, relevo sintético.<br>'
      : `Região: ${G.meta.nome} · célula ${G.cel} m · ${tam}`
        + (G.meta.idf ? ` · IDF K=${G.meta.idf.K} a=${G.meta.idf.a} b=${G.meta.idf.b} c=${G.meta.idf.c}` : '')
        + '<br>')
      + 'Pré-dimensionamento. Não substitui projeto executivo nem dispensa responsável técnico com ART.';
  }catch(err){
    aviso("Não foi possível abrir esta região", String(err.message||err));
  }
}

(async () => {
  const regioes = await listarRegioes();
  const sel = $('sel-regiao');
  if(regioes){
    sel.innerHTML = regioes.map((r,n)=>`<option value="${n}">${r.nome}</option>`).join('');
    sel.onchange = () => abrir(regioes[+sel.value]);
    await abrir(regioes[0]);
  }else{
    await abrir(null);
    sel.innerHTML = `<option>${G.meta && G.meta.nome ? G.meta.nome : 'Demonstração'}</option>`;
    sel.disabled = true;
    if(G.meta && G.meta.nome) document.title = `Vazão de microbacia — ${G.meta.nome}`;
  }
})();
</script>
</body>
</html>
